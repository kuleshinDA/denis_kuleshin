<!doctype html><html lang="ru"><meta charset="utf-8">
<title>denis_kuleshin — служба поддержки</title>
<style>body{font:16px Arial;margin:25px;max-width:1100px}input,select,textarea,button{padding:7px;margin:4px}table{border-collapse:collapse;width:100%}td,th{border:1px solid #ccc;padding:8px;text-align:left}#error{color:#a00}section{margin-top:20px}pre{white-space:pre-wrap}textarea{width:70%}</style>
<h1>denis_kuleshin — заявки в службу поддержки</h1>
<div id="login"><input id="username" value="demo_staff" aria-label="Логин"><input id="password" type="password" value="demo" aria-label="Пароль"><button onclick="signIn()">Войти</button></div>
<div id="nav" hidden><button onclick="showList()">Список заявок</button><button onclick="showSummary()">Сводка</button><button onclick="signOut()">Выйти</button><span id="who"></span></div>
<p id="error"></p><section id="screen"></section>
<script>
let cats=[],page=1,currentId=0,filterStatus='',filterCategory='';
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path,method='GET',data){let r=await fetch('/api'+path,{method,headers:{'Content-Type':'application/json'},...(data?{body:JSON.stringify(data)}:{})});let x=await r.json();if(!r.ok)throw Error(typeof x.detail==='string'?x.detail:JSON.stringify(x.detail));return x;}
function error(e){document.querySelector('#error').textContent=e.message;}
async function signIn(){try{let u=await api('/login','POST',{username:document.querySelector('#username').value,password:document.querySelector('#password').value});document.querySelector('#who').textContent=u.username;cats=(await api('/categories')).items;document.querySelector('#login').hidden=true;document.querySelector('#nav').hidden=false;await showList();}catch(e){error(e);}}
async function signOut(){try{await api('/logout','POST');location.reload();}catch(e){error(e);}}
function catOptions(all=false){return (all?'<option value="">Все категории</option>':'')+cats.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('');}
async function showList(){try{document.querySelector('#error').textContent='';let p=new URLSearchParams({page,size:20});if(filterStatus)p.set('status',filterStatus);if(filterCategory)p.set('category_id',filterCategory);let x=await api('/tickets?'+p);document.querySelector('#screen').innerHTML=`<h2>Список заявок</h2><select id="statusFilter"><option value="">Все статусы</option><option value="new">Новая</option><option value="in_progress">В работе</option><option value="closed">Закрыта</option></select><select id="categoryFilter">${catOptions(true)}</select><button onclick="applyFilter()">Фильтровать</button><p>Всего: ${x.total}. Страница: ${x.page}</p><table><tr><th>ID</th><th>Заявка</th><th>Статус</th><th>Категория</th><th>Автор</th></tr>${x.items.map(t=>`<tr><td>${t.id}</td><td><button onclick="showCard(${t.id})">${esc(t.title)}</button></td><td>${esc(t.status)}</td><td>${esc(t.category)}</td><td>${esc(t.username)}</td></tr>`).join('')}</table><button onclick="page=Math.max(1,page-1);showList()">Назад</button><button onclick="page++;showList()">Далее</button><h3>Создать заявку</h3><input id="newTitle" placeholder="Заголовок"><select id="newCategory">${catOptions()}</select><br><textarea id="newBody" placeholder="Описание"></textarea><br><button onclick="createTicket()">Создать</button>`;document.querySelector('#statusFilter').value=filterStatus;document.querySelector('#categoryFilter').value=filterCategory;}catch(e){error(e);}}
function applyFilter(){filterStatus=document.querySelector('#statusFilter').value;filterCategory=document.querySelector('#categoryFilter').value;page=1;showList();}
async function createTicket(){try{let t=await api('/tickets','POST',{title:document.querySelector('#newTitle').value,body:document.querySelector('#newBody').value,category_id:Number(document.querySelector('#newCategory').value)});await showCard(t.id);}catch(e){error(e);}}
async function showCard(id){try{currentId=id;let x=await api('/tickets/'+id),t=x.ticket;document.querySelector('#screen').innerHTML=`<h2>Карточка заявки ${t.id}</h2><h3>${esc(t.title)}</h3><p>${esc(t.body)}</p><p>Автор: ${esc(t.username)}. Категория: ${esc(t.category)}. Статус: ${esc(t.status)}.</p><p>Срок реакции: ${x.reaction.hours} ч. Норматив: ${x.reaction.limit_hours} ч. Первый ответ сотрудника: ${esc(x.reaction.first_staff_reply??'ещё нет')}. Нарушение: ${x.reaction.violated?'да':'нет'}.</p><select id="newStatus"><option value="in_progress">В работе</option><option value="closed">Закрыта</option></select><button onclick="changeStatus()">Изменить статус</button><h3>Комментарии</h3>${x.comments.map(c=>`<p><b>${esc(c.username)} (${c.is_staff?'сотрудник':'пользователь'})</b>: ${esc(c.body)}<br>${esc(c.created_at)}</p>`).join('')}<textarea id="commentBody" placeholder="Комментарий"></textarea><br><button onclick="addComment()">Отправить комментарий</button>`;document.querySelector('#error').textContent='';}catch(e){error(e);}}
async function changeStatus(){try{await api('/tickets/'+currentId+'/status','PATCH',{status:document.querySelector('#newStatus').value});await showCard(currentId);}catch(e){error(e);}}
async function addComment(){try{await api('/tickets/'+currentId+'/comments','POST',{body:document.querySelector('#commentBody').value});await showCard(currentId);}catch(e){error(e);}}
async function showSummary(){try{let x=await api('/summary');document.querySelector('#screen').innerHTML=`<h2>Сводка по всем данным</h2><p>${esc(x.definition)}</p><table><tr><th>Категория</th><th>Норматив, ч</th><th>Открыто</th><th>Нарушен норматив</th><th>Доля нарушений</th></tr>${x.items.map(c=>`<tr><td>${esc(c.name)}</td><td>${c.reaction_hours}</td><td>${c.open_count}</td><td>${c.violated_count}</td><td>${(c.violated_share*100).toFixed(2)} %</td></tr>`).join('')}</table>`;document.querySelector('#error').textContent='';}catch(e){error(e);}}
</script></html>
